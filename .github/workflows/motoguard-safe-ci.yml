name: MotoGuard Safe CI

on:
  pull_request:
    branches:
      - main
      - fix/remove-community-family-banner
  push:
    branches:
      - audit/add-nonprod-ci-gates

permissions:
  contents: read

concurrency:
  group: motoguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build (does not deploy)
        run: pnpm build

      - name: Firestore rules static audit report
        run: pnpm security:rules

      - name: Install isolated Firestore emulator test tools
        run: npm install --prefix .firestore-test-runtime --no-save --package-lock=false @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.22.0

      - name: Characterize current Firestore rules in emulator (non-production)
        run: .firestore-test-runtime/node_modules/.bin/firebase emulators:exec --only firestore --project demo-motoguard-firestore-rules "node scripts/firestore-rules.emulator.test.cjs"
