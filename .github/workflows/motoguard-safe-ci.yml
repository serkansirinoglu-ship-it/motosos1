name: MotoGuard Safe CI

on:
  pull_request:
    branches:
      - main
      - fix/remove-community-family-banner
  push:
    branches:
      - audit/add-nonprod-ci-gates

permissions:
  contents: write

concurrency:
  group: motoguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # First install regenerates an out-of-sync lockfile; the following step commits only that generated file.
      - name: Install dependencies and regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile when changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/add-nonprod-ci-gates'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync pnpm lockfile"
            git push
          fi

      - name: Verify lockfile is reproducible
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build (does not deploy)
        run: pnpm build
